apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspilot-web
  template:
    metadata:
      labels:
        app: opspilot-web
    spec:
      containers:
        - name: web
          image: ghcr.io/opspilot/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: opspilot-config
