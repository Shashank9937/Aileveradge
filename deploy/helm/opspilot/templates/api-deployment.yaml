apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opspilot.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "opspilot.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "opspilot.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: 4000
