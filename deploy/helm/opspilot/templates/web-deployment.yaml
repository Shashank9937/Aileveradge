apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opspilot.fullname" . }}-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ include "opspilot.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "opspilot.fullname" . }}-web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports:
            - containerPort: 3000
