services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: opspilot-temporal
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: opspilot-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    container_name: opspilot-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  executor:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        WORKER_PACKAGE: "@ops-pilot/executor"
        WORKER_ENTRY: "services/executor/dist/index.js"
    container_name: opspilot-executor
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - redis

volumes:
  pgdata:
